<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE INVESTIGATION — THE PRICE OF IMPUNITY</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#070707;color:#eee;font:200 11px/1.85 monospace}a{color:inherit}header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #353535;gap:12px}header a{text-decoration:none}header strong{font-size:12px;letter-spacing:.12em}nav{display:flex;gap:23px;letter-spacing:.1em}main{display:grid;grid-template-columns:minmax(300px,38%) 1fr;min-height:calc(100svh - 58px)}article{padding:40px clamp(22px,4vw,65px) 35px;max-height:calc(100svh - 58px);overflow-y:auto}#map{height:calc(100svh - 58px);background:#151515}.eyebrow{color:#aaa;letter-spacing:.14em;font-size:10px}.chapters{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0 35px}.chapters button{border:1px solid #444;background:transparent;color:#aaa;padding:7px 11px;font:11px monospace;cursor:pointer}.chapters button.active{background:#eee;color:#111;border-color:#eee}h1,h2{font-family:Georgia,serif;font-weight:400;line-height:1.18}h1{font-size:clamp(28px,3.5vw,46px);margin:15px 0 25px}h2{font-size:25px;margin:20px 0}p{color:#c8c8c8;font-size:12px;line-height:1.9}.source{border-top:1px solid #333;padding-top:20px;margin-top:30px}.source a{display:block;margin:12px 0;text-decoration:underline;text-underline-offset:3px}.controls{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #444;padding-top:22px;margin-top:35px;gap:10px}.controls button{border:0;background:transparent;color:#eee;font:11px monospace;cursor:pointer;padding:9px 0}.controls button:disabled{opacity:.25;cursor:default}.key{margin-top:20px;color:#aaa;font-size:10px}.key span{display:inline-block;margin-right:13px}.swatch{width:8px;height:8px;display:inline-block;margin-right:5px;border-radius:50%}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#111;color:#eee;border-radius:0}.leaflet-popup-content{font:11px/1.6 monospace}.leaflet-popup-content a{color:#eee}.leaflet-control-zoom a{background:#111!important;color:#fff!important}.leaflet-control-attribution{font-size:9px!important}@media(max-width:800px){header{height:52px;padding:0 12px}header strong{font-size:10px}nav{gap:12px;font-size:10px}main{display:flex;flex-direction:column}article{max-height:none;overflow:visible;padding:25px 18px 30px}#map{height:55svh;min-height:340px}.chapters{margin:15px 0 25px}}</style></head><body><header><a href="../"><strong>THE PRICE OF IMPUNITY</strong></a><nav><a href="../">THE MAP</a><a href="./">THE INVESTIGATION</a><a href="../#about">ABOUT</a></nav></header><main><article><div class="eyebrow">MADRE DE DIOS, PERU · 2019–2025</div><div class="chapters" id="chapters"></div><div class="eyebrow" id="number"></div><h1 id="title"></h1><div id="body"></div><div class="source"><div class="eyebrow">EVIDENCE & SOURCES</div><div id="sources"></div></div><div class="key"><span><i class="swatch" style="background:#e2bb55"></i>Mining</span><span><i class="swatch" style="background:#ee6694"></i>Trafficking</span><span><i class="swatch" style="background:#77b9ef"></i>Institutions</span></div><div class="controls"><button id="prev">← PREVIOUS</button><span class="eyebrow" id="progress"></span><button id="next">NEXT →</button></div></article><div id="map" aria-label="Chapter-linked interactive satellite map"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const chapters=[
{title:"The Gold Rush",center:[-12.85,-69.57],zoom:10,mode:"mining",body:["Gold mining transformed sections of Madre de Dios into a landscape of excavated earth, water-filled pits and fragmented forest. The Interoceanic Highway links extraction zones to settlements and markets.","Satellite observations provide evidence of mining-related land disturbance. They do not, by themselves, establish whether a specific operator had legal authorization.","The first question is geographic: where has mining occurred, and how has its footprint changed?"],sources:[["Amazon Mining Watch — model-detected mining scars","https://source.coop/earthgenome/amazon-mining-watch"],["MAAP — satellite monitoring","https://www.maapprogram.org/"]]},
{title:"The Routes",center:[-9.9,-73.2],zoom:6,mode:"routes",body:["The geography of exploitation begins outside La Pampa. Prosecutors documented a case in which two young women were recruited in Tarapoto with promises of paid employment and transported to a bar at kilometer 107 in La Pampa.","The pink line connects the documented recruitment origin and exploitation destination. It is not a reconstruction of the precise route traveled.","The same mining frontier can therefore be examined as a destination within a wider geography of recruitment, deception and exploitation."],sources:[["Ministerio Público — Tarapoto to La Pampa case","https://www.gob.pe/institucion/mpfn/noticias/834447-madre-de-dios-sentencian-a-mujer-que-capto-a-dos-jovenes-para-explotarlas-en-bar-de-la-pampa"]]},
{title:"The Institutions",center:[-12.59,-69.18],zoom:12,mode:"institutions",body:["Police, prosecutors and courts are responsible for investigating and prosecuting trafficking and related crimes. Their decisions form a second documentary geography.","In 2024, the judiciary reported pretrial detention for an anti-trafficking police officer accused of demanding money and sexual favors. Pretrial detention is not a finding of guilt.","Separately, disciplinary and judicial records involving a prosecutor in Madre de Dios illustrate how administrative sanctions and criminal proceedings can concern the same official while remaining legally distinct. They must not be treated as proof of a coordinated network."],sources:[["Poder Judicial — Marce Pari proceeding","https://www.pj.gob.pe/wps/wcm/connect/cortesuperiormadrediospj/s_csj_madre_de_dios_nuevo/as_inicio/as_imagen_prensa/as_noticias/csjmd_n5mesesprision-preventiva"],["JNJ — disciplinary dismissals","https://www.gob.pe/institucion/jnj/noticias/913668-jnj-destituye-a-fiscales-provinciales-de-madre-de-dios-vinculadas-al-trafico-de-madera"]]},
{title:"The Connections",center:[-11.7,-71.3],zoom:7,mode:"connections",body:["The layers can now be viewed together: mining-scar detections, documented recruitment endpoints, trafficking investigations and institutional proceedings.","A pink line identifies a source-documented origin-to-destination relationship. A blue line joins records concerning the same named official. Mining scars show detected land disturbance, not proof of involvement in a trafficking case.","Visual proximity is a question for investigation, not an answer. No line on this map should be read as evidence of collusion unless the cited documents establish that relationship."],sources:[["Explore the complete evidence map","../"],["Amazon Mining Watch — data methodology","https://source.coop/earthgenome/amazon-mining-watch"]]},
{title:"The Price of Impunity",center:[-12.72,-69.78],zoom:9,mode:"question",body:["Robert Klitgaard proposed a framework for corruption: C = M + D − A — monopoly plus discretion minus accountability.","This investigation asks whether failures of enforcement reflect limited state capacity, deliberate obstruction, or both. Individual allegations, sanctions and convictions must be kept separate, and absence of enforcement cannot alone prove bribery.","The map is an evolving evidence archive. Its unanswered questions are part of the investigation: which decisions can be traced to named officials, which cases reached judgment, and where does the documentary record end?"],sources:[["Explore all mapped case files","../"],["JNJ — documented disciplinary outcome","https://www.gob.pe/institucion/jnj/noticias/913668-jnj-destituye-a-fiscales-provinciales-de-madre-de-dios-vinculadas-al-trafico-de-madera"]]}
];
const map=L.map("map",{zoomControl:false,scrollWheelZoom:false}).setView([-12.85,-69.57],10);L.control.zoom({position:"bottomright"}).addTo(map);L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:18,attribution:"Imagery © Esri"}).addTo(map);L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:18}).addTo(map);
const layer=L.layerGroup().addTo(map);let footprints=null;fetch("../la_pampa_mining_preview.geojson").then(r=>r.ok?r.json():null).then(j=>{footprints=j;render()}).catch(()=>{});let current=0;
function dot(lat,lng,color,label,source){L.circleMarker([lat,lng],{radius:7,color:"#111",weight:2,fillColor:color,fillOpacity:1}).bindPopup("<strong>"+label+"</strong>"+(source?"<p><a target='_blank' rel='noopener' href='"+source+"'>View original source</a></p>":"")).addTo(layer)}
function render(){const c=chapters[current];document.getElementById("number").textContent="CHAPTER "+String(current+1).padStart(2,"0")+" / 05";document.getElementById("title").textContent=c.title;document.getElementById("body").replaceChildren(...c.body.map(t=>{const p=document.createElement("p");p.textContent=t;return p}));const src=document.getElementById("sources");src.replaceChildren(...c.sources.map(([label,url])=>{const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";a.textContent=label;return a}));document.getElementById("progress").textContent=(current+1)+" / 5";document.getElementById("prev").disabled=current===0;document.getElementById("next").disabled=current===4;document.getElementById("chapters").replaceChildren(...chapters.map((v,i)=>{const b=document.createElement("button");b.textContent=String(i+1).padStart(2,"0");b.className=i===current?"active":"";b.title=v.title;b.onclick=()=>go(i);return b}));layer.clearLayers();map.flyTo(c.center,c.zoom,{duration:.9});if(["mining","connections","question"].includes(c.mode)&&footprints)L.geoJSON(footprints,{style:{color:"#e2bb55",weight:1,fillColor:"#e2bb55",fillOpacity:.34},onEachFeature:(f,l)=>l.bindPopup("Model-detected mining-scar preview; simplified geometry. Legal status unknown. 2025 quarterly detections provisional.")}).addTo(layer);
if(["routes","connections"].includes(c.mode)){const a=[-6.487,-76.359],b=[-12.84,-69.52],pts=[];for(let i=0;i<=75;i++){let t=i/75;pts.push([a[0]+(b[0]-a[0])*t+1.25*Math.sin(Math.PI*t),a[1]+(b[1]-a[1])*t+.65*Math.sin(Math.PI*t)])}L.polyline(pts,{color:"#ee6694",weight:3,opacity:.9}).bindPopup("Documented recruitment endpoints: Tarapoto → La Pampa. This curve is not a verified travel itinerary.").addTo(layer);dot(...a,"#ee6694","Tarapoto · recruitment origin",chapters[1].sources[0][1]);dot(...b,"#ee6694","La Pampa Km 107 · exploitation destination",chapters[1].sources[0][1])}
if(["institutions","connections","question"].includes(c.mode)){dot(-12.584,-69.174,"#77b9ef","Marce Pari · pretrial detention, not conviction",chapters[2].sources[0][1]);dot(-12.594,-69.181,"#77b9ef","JNJ disciplinary proceeding · separate case",chapters[2].sources[1][1]);if(c.mode!=="institutions")L.polyline([[-12.594,-69.181],[-12.595,-69.183]],{color:"#77b9ef",weight:3}).bindPopup("Same named official appears in separate disciplinary and judicial records; this does not prove coordinated crime.").addTo(layer)}
if(c.mode==="question"){dot(-12.86,-69.52,"#e2bb55","La Pampa · mining study area","https://www.maapprogram.org/");dot(-12.598,-69.18,"#ee6694","Puerto Maldonado · trafficking proceeding","https://www.gob.pe/institucion/mpfn/noticias/1060581-tras-requerimiento-de-la-fiscalia-dictan-prision-preventiva-contra-investigado-por-explotacion-sexual-y-favorecimiento-a-la-prostitucion")}}
function go(i){current=Math.max(0,Math.min(4,i));render()}document.getElementById("prev").onclick=()=>go(current-1);document.getElementById("next").onclick=()=>go(current+1);render();
</script></body></html>
