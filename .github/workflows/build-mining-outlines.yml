name: Build regional mining-scar outlines
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_mining_outlines.py'
      - '.github/workflows/build-mining-outlines.yml'
permissions:
  contents: write
jobs:
  outlines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial dependencies
        run: python -m pip install --quiet numpy scipy rasterio shapely
      - name: Derive web-map outlines from source raster
        run: python scripts/build_mining_outlines.py
      - name: Commit generated data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/madre_de_dios_mining_scar_outlines.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Update model-detected regional mining disturbance outlines"
            git push
          fi
